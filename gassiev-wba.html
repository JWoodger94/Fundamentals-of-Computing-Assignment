  <h1>Gassiev unsure if Fury v Joshua will be for his WBA belt</h1><br>
  <figure>
  <blockquote class="blockquote">
    <p>Murat Gassiev says he currently has no idea if he still is the WBA heavyweight champion after reports Tyson Fury and Anthony Joshua would fight for his belt.</p>
    <p>Gasiev, 32, was upgraded to 'super' champion in July when Oleksandr Usyk vacated the title, having been the 'regular' belt holder since 2025.</p>
    <p>Fury and Joshua are scheduled to fight on 11 December in Cardiff and it was claimed that bout would be for the title Gassiev currently holds. Speaking to ESPN, external and after reaching out to the WBA, Gassiev says he is still in the dark.</p>
    <p>"[The] WBA give me big surprise about my belt. But in press conference when AJ and Fury have face off, I see only Ring Magazine belt, no WBA belt," Gassiev said.</p>
    <p>"And to be honest right now, I don't have clear information about this situation. I don't know. Fight for 'super' belt, another belt, I don't know. "I check my email. I don't have any messages, any papers, but I'm not manager, promoter [or] lawyer. I'm fighter. I do my job, that's it."</p>
    <p>The WBA recognise their 'super' champion as their full champion, while the 'regular' belt holder is often the number one contender to their world title. There are four major world titles in boxing – the WBA 'super', the IBF, the WBC and the WBO belts. Gassiev is still listed on the WBA's website as their reigning champion, with Fury ranked number two behind American Jarrell Miller and Joshua at three.</p>
    <p>Joshua and Fury are both two-time heavyweight world champions and held a launch news conference last week in London. The heavyweights will meet at Cardiff's Principality stadium after a decade-long effort to bring the British rivals together in the ring.</p>
    <figcaption class="blockquote-footer">
        Courtesy of <cite title="Source Title">BBC Sport</cite>
    </figcaption>
  </blockquote>
