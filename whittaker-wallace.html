  <h1>Ben Whittaker badly hurt in final round but avoids major upset</h1><br>
  <figure>
  <blockquote class="blockquote">
    <p>British light-heavyweight Ben Whittaker survived a dramatic late onslaught from Conor Wallace to move a step closer to a world-title shot with a points victory in Birmingham.</p>
    <p>The 29-year-old controlled much of the contest with his trademark showboating and superior boxing skill at the Utilita Arena before Wallace came roaring back in the championship rounds.</p>
    <p>The Northern Irishman rocked Whittaker in the 10th and came close to a remarkable turnaround in the 12th, with the home fighter forced to hold on until the final bell.</p>
    <p>The judges scored it 117-111, 116-112 and 115-113 as Whittaker became mandatory challenger for the IBF world title.</p>
    <p>"It was too easy and I took my eye off the ball a little bit. He caught me with a good shot but that's boxing," Whittaker said.</p>
    <p>The Olympic silver medallist extended his unbeaten professional record to 13 wins and one draw and is now mandatory challenger for IBF champion Dmitry Bivol, who also holds the WBA 'super' and WBO belts and is expected to face Liverpool's Callum Smith in December.</p>
    <figcaption class="blockquote-footer">
        Courtesy of <cite title="Source Title">BBC Sport</cite>
    </figcaption>
  </blockquote>
  </figure>
