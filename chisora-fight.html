  <h1>Derek Chisora's u-turn on retirement - fights in December</h1><br>
  <figure>
  <blockquote class="blockquote">
    <p>Derek Chisora says he is not retiring and will fight again in December.</p>
    <p>The 42-year-old Briton lost to Deontay Wilder in April in what was billed as his 50th and final fight.</p>
    <p>However, Chisora has since refused to confirm his retirement. Speaking at a news conference on Tuesday, he said he believed he would fight in December against Murat Gassiev.</p>
    <p>"December will be me versus Gassiev," Chisora said.</p>
    <p>"We're going to decide where, either in London or Manchester. We're going to put two belts on the line, I believe, the IBA and the one Gassiev holds."</p>
    <p>"What people have to understand is that what the IBA does is unbelievable. I believe this goes deeper than that we're doing here right now.</p>
    <p>"I believe it's going to get better and better. In December we'll be fighting."</p>
    <p>Gassiev is currently the WBA 'super' heavyweight world champion, but his status is unclear after reports claimed Tyson Fury and Anthony Joshua would be fighting for his world title in their contest on 11 December.</p>
    <p>The Russian said on Tuesday he was unsure if he remained the WBA's world champion.</p>
    <figcaption class="blockquote-footer">
        Courtesy of <cite title="Source Title">BBC Sport</cite>
    </figcaption>
  </blockquote>
  </figure>
