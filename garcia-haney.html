  <h1>Ryan Garcia And Devin Haney Exchange Rematch DMs</h1><br>
  <figure>
  <blockquote class="blockquote">
    <p>Devin Haney appears open to a Ryan Garcia rematch, replying, “Let’s make the fight,” in an Instagram DM screenshot shared on X by Dan The Boxing Man and later reposted by Source of Boxing.</p>
    <p>Haney’s apparent invitation follows Ryan asking, “Do I have to remind you again.” The exchange then turns to various accusations against Garcia, which Ryan denied before making counter claims against Haney. Neither fighter discusses a date, weight, or purse in the screenshot. It shows interest in a rematch, but no agreed terms.</p>
    <p>Ryan pursuing Haney suggests he may prefer a bigger payday over facing Isaac Cruz or Angel Fierro. That could fit Golden Boy’s plans for a May event, although waiting would bring the inactivity concerns outlined below.</p><br>
    <h2>Ryan Garcia Faces Eight Months Out Under Oscar’s Plan</h2><br>
    <p>Oscar De La Hoya wants Ryan Garcia to face Devin Haney or Teofimo Lopez in May 2027, saving his final contracted Golden Boy fight for a big payday. The downside for Ryan is that waiting until Cinco de Mayo would leave him inactive for roughly eight months before facing either opponent.</p>
    <p>Ryan has discussed returning in December or January, but De La Hoya said he spoke with DAZN and there were no dates available in those months. Neither Haney nor Lopez is secured, with Oscar describing informal discussions rather than official negotiations.</p>
    <p>You can understand why De La Hoya wants to wait. Ryan has one fight left with Golden Boy, and Oscar wants it to be a big one. A Haney rematch or a fight with Lopez would likely bring in far more money than Angel Fierro or Pitbull Cruz.</p>
    <p>If Ryan finishes his contract against either of those two, Golden Boy could miss out on the bigger payday that follows. De La Hoya wants to continue working with Ryan, but there is no guarantee he will sign another deal.</p>
    <p>Ryan has a reason to want that earlier return. Neither Haney nor Lopez is an opponent you want to face after eight months out. Fighting in December or January would keep him busy rather than sending him straight into a difficult fight after a long break.</p>
    <p>The trouble is that saving the fight for May benefits Golden Boy more than it helps Ryan stay ready. Oscar gets the chance to cash in on a major event, but Ryan has to beat Haney or Lopez after eight months on the sidelines.</p>
    <figcaption class="blockquote-footer">
        Courtesy of <cite title="Source Title">Boxing News 24</cite>

  </blockquote>
